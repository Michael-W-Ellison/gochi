# Gochi server settings
#
# The server reads this file at startup (or the file given with -config).
# Command-line options override these settings, and a setting left out
# keeps its default. Unknown settings stop the server with an error.

server:
  # Address and port the web server listens on
  addr: ":8080"

  # Directory for saved pets (saves/) and backups (backups/). Empty means
  # ~/.gochi. A relative path is relative to this file's directory.
  data_dir: ""

  # Turns on the REST API at /api/v1 for requests carrying this token
  # (Authorization: Bearer <token>). Empty leaves the API off.
  api_token: ""

  # How many REST API requests each client (by IP address) may make per
  # minute; 0 turns the limit off
  api_rate_limit: 120

simulation:
  # Game speed: game (one game day per real minute), 24x (one game day per
  # real hour), 4x (one game day per six real hours) or realtime
  time_scale: "game"

  # How often the active pet is saved automatically; 0 turns autosave off.
  # Durations use Go syntax, such as 30s, 5m or 1h.
  autosave: 1m

  # Pause time once the player has been away this long; 0 turns the away
  # pause off
  away_pause: 2m
