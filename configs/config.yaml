# Gochi server settings
#
# The server reads this file at startup (or the file given with -config).
# Command-line options override these settings, and a setting left out
# keeps its default. Unknown settings stop the server with an error.

server:
  # Address and port the web server listens on. The default answers only
  # this computer. To play on a phone or tablet too (AR), use ":8080" to
  # listen on the network; other devices must then be paired with a code
  # shown under Privacy on this computer.
  addr: "127.0.0.1:8080"

  # Directory for saved pets (saves/) and backups (backups/). Empty means
  # ~/.gochi. A relative path is relative to this file's directory.
  data_dir: ""

  # Turns on the REST API at /api/v1 for requests carrying this token
  # (Authorization: Bearer <token>). Empty leaves the API off.
  api_token: ""

  # How many REST API requests each client (by IP address) may make per
  # minute; 0 turns the limit off
  api_rate_limit: 120

  # Serve HTTPS instead of HTTP with this certificate and private key (PEM
  # files, such as from Let's Encrypt). Set both or neither. A relative
  # path is relative to this file's directory.
  tls_cert: ""
  tls_key: ""

hub:
  # Also run this server as a cloud hub at /hub/v1, which other Gochi
  # servers can connect to (from the Cloud panel) to back up and sync pets,
  # share achievements and meet at playdates. Hub data is kept in the data
  # directory's hub/ folder.
  enabled: false

  # The code players need to register with the hub. Empty closes
  # registration (existing accounts still work).
  join_code: ""

  # Where the hub listens. The hub always uses HTTPS: with the certificate
  # above if one is set, otherwise its own, made on first start and kept in
  # the hub/ folder (its fingerprint is printed at startup).
  addr: ":8443"

simulation:
  # Game speed: game (one game day per real minute), 24x (one game day per
  # real hour), 4x (one game day per six real hours) or realtime
  time_scale: "game"

  # How often the active pet is saved automatically; 0 turns autosave off.
  # Durations use Go syntax, such as 30s, 5m or 1h.
  autosave: 1m

  # Pause time once the player has been away this long; 0 turns the away
  # pause off
  away_pause: 2m
